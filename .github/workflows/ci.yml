name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build universal app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Run self-test
        run: swift run MemWatch --self-test

      - name: Run one-shot sampler
        run: swift run MemWatch --once

      - name: Build Swift package
        run: swift build

      - name: Build universal app bundle
        run: scripts/build-app.sh

      - name: Verify universal binary architectures
        run: |
          ARCHS="$(lipo -archs dist/MemWatch.app/Contents/MacOS/MemWatch)"
          echo "$ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]
